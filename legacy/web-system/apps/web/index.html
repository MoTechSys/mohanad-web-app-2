<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#059669" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="نظام إدارة بقالة أونلاين — مبيعات، عملاء، موردون، مصاريف، تقارير" />
    <title>نظام إدارة بقالة</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="بقالتي" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preload self-hosted fonts (woff2). 400 first, then weights used
         on dashboard. JetBrains Mono preloaded for numeric/tabular columns. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans-arabic-400.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans-arabic-500.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans-arabic-600.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-400.woff2"
      crossorigin="anonymous"
    />

    <!-- Splash screen — visible only until React mounts and replaces #root.
         Uses the same Emerald gradient as the LoginPage so the transition
         feels seamless. CSS is inlined to avoid an extra HTTP roundtrip. -->
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background:
          radial-gradient(1200px 600px at 100% -100px, rgba(5, 150, 105, 0.18), transparent 60%),
          radial-gradient(800px 400px at -100px 100%, rgba(2, 132, 199, 0.12), transparent 60%),
          linear-gradient(135deg, #ecfdf5 0%, #d1fae5 35%, #a7f3d0 70%, #6ee7b7 100%);
        font-family:
          'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;
        transition: opacity 280ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #splash[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem 2rem;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #047857 0%, #059669 70%, #10b981 100%);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 700;
        box-shadow:
          0 0 0 1px rgba(5, 150, 105, 0.18),
          0 8px 30px rgba(5, 150, 105, 0.28);
        animation: splash-pop 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .splash-name {
        color: #064e3b;
        font-size: 1.05rem;
        font-weight: 600;
        opacity: 0;
        animation: splash-fade 320ms ease-out 220ms forwards;
      }
      .splash-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(5, 150, 105, 0.18);
        border-top-color: #059669;
        border-radius: 9999px;
        animation: splash-spin 720ms linear infinite;
        opacity: 0;
        animation:
          splash-fade 320ms ease-out 320ms forwards,
          splash-spin 720ms linear infinite;
      }
      @keyframes splash-pop {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-surface antialiased">
    <div id="root"></div>

    <!-- Splash hidden by main.tsx after React renders. -->
    <div id="splash" role="status" aria-live="polite" aria-label="جاري التحميل">
      <div class="splash-card">
        <div class="splash-logo" aria-hidden="true">ب</div>
        <div class="splash-name">نظام إدارة بقالة</div>
        <div class="splash-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
