<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>لا يوجد اتصال — نظام إدارة بقالة</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #064e3b;
        background:
          radial-gradient(1200px 600px at 100% -100px, rgba(5, 150, 105, 0.18), transparent 60%),
          radial-gradient(800px 400px at -100px 100%, rgba(2, 132, 199, 0.10), transparent 60%),
          linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 10px 40px rgba(5, 150, 105, 0.12);
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 1rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #047857 0%, #059669 70%, #10b981 100%);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 700;
        box-shadow: 0 8px 30px rgba(5, 150, 105, 0.28);
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
        font-weight: 700;
        color: #064e3b;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.7;
        color: #065f46;
        font-size: 0.95rem;
      }
      button {
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #047857 0%, #059669 100%);
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(5, 150, 105, 0.45); }
      button:active { transform: translateY(0); }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #047857;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card" role="status" aria-live="polite">
        <div class="logo" aria-hidden="true">ب</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>
          تعذّر الوصول إلى الخادم. تأكّد من اتصالك بالشبكة ثم حاول مرة أخرى.
          العمليات المالية تتطلّب اتصالاً نشطاً ولا تُنفَّذ في وضع عدم الاتصال.
        </p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
        <div class="hint">نظام إدارة بقالة</div>
      </section>
    </main>
  </body>
</html>
