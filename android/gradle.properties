# 4G is plenty for this project (R8 + Kotlin); 8G caused OOM-kills on 8GB CI boxes.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true

# ── ML Kit barcode model ─────────────────────────────────────────────────
# false (default) = model bundled in the APK (+~3MB, works offline instantly).
# true            = "lite" build: model downloaded once by Google Play Services
#                   on first scan (needs Play Services + one-time internet).
# Build lite:  flutter build apk --release --split-per-abi \
#              -Pdev.steenbakker.mobile_scanner.useUnbundled=true
dev.steenbakker.mobile_scanner.useUnbundled=false
