name: grocery_ledger
description: "دفتر البقالة — نظام حسابات بقالة محلي بالكامل: عملاء وديون، موردون ومشتريات، مبيعات، مصاريف، مخزون وتقارير."
publish_to: 'none'
version: 2.2.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: 2.2.3
  hive_flutter: 1.1.0
  provider: 6.1.5+1
  intl: 0.20.2
  mobile_scanner: 7.1.4
  pdf: 3.11.3
  printing: 5.14.2
  excel: 4.0.6
  share_plus: 10.1.4
  path_provider: 2.1.5
  image_picker: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoNaskhArabic-Regular.ttf
